services:
  iptv-playlist:
    build: .
    container_name: iptv-playlist
    ports:
      - "8080:8080"
    environment:
      # Your upstream playlists. Formats (mix and match):
      #   "Name|https://.../playlist.m3u,Other|https://.../x.m3u8"
      #   "https://a.m3u,https://b.m3u8"                      (auto-named)
      #   '[{"name":"Pro A","url":"https://..."}]'            (JSON)
      PLAYLISTS: ${PLAYLISTS:-}
      CACHE_TTL: ${CACHE_TTL:-900}
      USER_AGENT: ${USER_AGENT:-IPTV-Tizen/1.0}
    restart: unless-stopped
