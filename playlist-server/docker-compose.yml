services:
  iptv-playlist:
    build: .
    container_name: iptv-playlist
    ports:
      - "8080:8080"
    environment:
      # Base playlists (add more anytime, or use the admin API at runtime):
      #   "Name|https://...m3u,Other|https://...m3u8"   or JSON '[{"name":"...","url":"..."}]'
      PLAYLISTS: ${PLAYLISTS:-}
      CACHE_TTL: ${CACHE_TTL:-900}
      USER_AGENT: ${USER_AGENT:-IPTV-Tizen/1.0}
      # Enables POST/DELETE /admin/sources (leave empty to disable admin API):
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    volumes:
      - ./data:/data
    restart: unless-stopped
